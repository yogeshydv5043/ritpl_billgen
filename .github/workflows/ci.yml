name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: billgen_test
          POSTGRES_USER: billgen
          POSTGRES_PASSWORD: billgen_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billgen -d billgen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/billgen_test
      SPRING_DATASOURCE_USERNAME: billgen
      SPRING_DATASOURCE_PASSWORD: billgen_ci_only
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: "6379"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B -ntp -DskipTests compile

      - name: Run tests
        run: mvn -B -ntp test

      - name: Package application
        run: mvn -B -ntp -DskipTests package

      - name: Summarise test results
        if: always()
        run: |
          echo "### Test results" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ -d target/surefire-reports ]; then
            grep -h "Tests run" target/surefire-reports/*.txt >> "$GITHUB_STEP_SUMMARY" \
              || echo "No Surefire summary files were produced." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test reports were produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
