<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create customer account')}"></head>
<body class="login-body">
<main class="login-shell">
    <a class="brand login-brand" th:href="@{/plans}"><span class="brand-mark">b<span>.</span></span><span class="brand-copy"><strong>billgen</strong><small>INVOICE STUDIO</small></span></a>
    <section class="login-card">
        <span class="kicker">START YOUR WORKSPACE</span><h1>Create your customer account</h1>
        <p class="page-lede">No checkout or payment details are required. Choose an available plan after signing in; activation is immediate.</p>
        <div class="global-errors" th:if="${#fields.hasGlobalErrors()}"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Please check the form.</p></div>
        <form th:action="@{/register}" th:object="${registrationForm}" method="post" novalidate>
            <div class="field"><label for="companyName">Company name</label><input id="companyName" th:field="*{companyName}" required><small class="field-error" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></small></div>
            <div class="field"><label for="contactName">Contact name</label><input id="contactName" th:field="*{contactName}" required><small class="field-error" th:if="${#fields.hasErrors('contactName')}" th:errors="*{contactName}"></small></div>
            <div class="field"><label for="email">Email</label><input id="email" type="email" th:field="*{email}" autocomplete="email" required><small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small></div>
            <div class="field"><label for="phone">Phone <span class="field-help">optional</span></label><input id="phone" th:field="*{phone}"></div>
            <div class="field"><label for="country">Country</label><input id="country" th:field="*{country}" value="India" required></div>
            <div class="field"><label for="password">Password</label><input id="password" type="password" th:field="*{password}" autocomplete="new-password" minlength="8" required><small class="field-help">Use at least 8 characters.</small><small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small></div>
            <button class="button button-primary button-full" type="submit">Create account <span>→</span></button>
        </form>
        <p class="login-footnote">Already have an account? <a th:href="@{/login}">Sign in</a></p>
    </section>
</main>
</body></html>
