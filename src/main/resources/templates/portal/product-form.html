<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${formTitle})}"></head>
<body class="app-body"><div class="app-layout"><div class="nav-scrim" onclick="BillGen.toggleNav(false)"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside>
<main class="app-main"><header th:replace="~{fragments/layout :: topbar}"></header><div class="page-content page-content-narrow">
    <div class="breadcrumb"><a th:href="@{/portal/products}">My products</a><span>/</span><span th:text="${formTitle}">Add product</span></div>
    <section class="page-title-row compact-title"><div><span class="kicker">YOUR CATALOGUE</span><h1 th:text="${formTitle}">Add product</h1><p class="page-lede">This product is owned by your account and will be available to your invoices.</p></div></section>
    <form class="panel form-panel" th:action="@{${formAction}}" th:object="${productForm}" method="post" novalidate>
        <div class="form-intro"><span class="form-step">01</span><div><h2>Item details</h2><p>What do you sell, and what should you call it?</p></div></div>
        <div class="form-grid"><div class="field"><label for="name">Name <span class="required">*</span></label><input id="name" th:field="*{name}" placeholder="e.g. Consulting services"><small class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small></div><div class="field"><label for="sku">SKU / short code <span class="required">*</span></label><input id="sku" th:field="*{sku}" placeholder="e.g. SVC-CONSULT" autocapitalize="characters"><small class="field-error" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></small></div>
            <div class="field"><label for="productType">Type <span class="required">*</span></label><select id="productType" th:field="*{productType}"><option th:each="type : ${productTypes}" th:value="${type}" th:text="${type.displayName}">Service</option></select><small class="field-error" th:if="${#fields.hasErrors('productType')}" th:errors="*{productType}"></small></div>
            <div class="field"><label for="categoryId">Category</label><select id="categoryId" th:field="*{categoryId}"><option value="">No category</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Services</option></select><small class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></small><small class="field-help"><a th:href="@{/portal/categories}">Manage your categories</a></small></div>
            <div class="field"><label for="unitPrice">Unit price <span class="required">*</span></label><div class="input-prefix"><span>₹</span><input id="unitPrice" type="number" min="0" step="0.01" th:field="*{unitPrice}" placeholder="0.00"></div><small class="field-error" th:if="${#fields.hasErrors('unitPrice')}" th:errors="*{unitPrice}"></small></div><div class="field"><label for="taxRate">Tax rate <span class="required">*</span></label><div class="input-suffix"><input id="taxRate" type="number" min="0" max="100" step="0.01" th:field="*{taxRate}"><span>%</span></div><small class="field-error" th:if="${#fields.hasErrors('taxRate')}" th:errors="*{taxRate}"></small></div>
            <div class="field field-full"><label for="description">Description <span class="optional">OPTIONAL</span></label><textarea id="description" rows="3" th:field="*{description}" placeholder="A short note to help recognise this item"></textarea><small class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small></div>
            <div class="field field-full"><label class="check-field"><input type="checkbox" th:field="*{active}"><span class="custom-check"></span><span><strong>Available for my new invoices</strong><small>Hidden items remain in your catalogue and past invoices.</small></span></label></div>
        </div>
        <div class="global-errors" th:if="${#fields.hasGlobalErrors()}"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Please check the details.</p></div>
        <div class="form-actions"><a class="button button-quiet" th:href="@{/portal/products}">Cancel</a><button class="button button-primary" type="submit">Save item <span>→</span></button></div>
    </form>
</div></main></div></body></html>
