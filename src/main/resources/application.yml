spring:
  application:
    name: billgen
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billgen}
    username: ${SPRING_DATASOURCE_USERNAME:billgen}
    password: ${SPRING_DATASOURCE_PASSWORD:billgen}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
  cache:
    type: redis
    redis:
      time-to-live: 180s
      cache-null-values: false
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: billgen:sessions
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
app:
  demo:
    seed-enabled: ${APP_DEMO_SEED_ENABLED:true}
    password: ${DEMO_PASSWORD:ChangeMe123!}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
